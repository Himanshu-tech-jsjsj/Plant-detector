<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer aperture lens ticks -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="4" opacity="0.3" stroke-dasharray="16 12" />
  
  <!-- Outer glowing camera lens frame -->
  <circle cx="256" cy="256" r="150" fill="#022c22" stroke="url(#lensRing)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Camera Lens Shutter Blades (Subtle) -->
  <circle cx="256" cy="256" r="120" fill="#064e3b" opacity="0.7" />

  <!-- Central stylized Leaf fused with Camera Sensor & Aperture -->
  <path d="M256 140 C 330 150 360 220 330 290 C 300 360 256 372 256 372 C 256 372 212 360 182 290 C 152 220 182 150 256 140 Z" 
        fill="url(#leafGrad)" />
        
  <!-- Leaf Central Vein / Sensor optical axis -->
  <path d="M256 148 Q 256 260 256 364" stroke="#D1FAE5" stroke-width="6" stroke-linecap="round" />
  <path d="M256 210 Q 285 195 295 180" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" />
  <path d="M256 245 Q 225 230 215 215" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" />
  <path d="M256 280 Q 285 265 298 250" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" />
  <path d="M256 315 Q 230 300 220 285" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" />

  <!-- Camera Lens Optical Reflection Glint -->
  <ellipse cx="230" cy="190" rx="30" ry="15" transform="rotate(-30 230 190)" fill="#ffffff" opacity="0.4" />
  <circle cx="290" cy="300" r="10" fill="#2DD4BF" opacity="0.6" />

  <!-- Lens crosshair focus brackets -->
  <path d="M190 200 L190 190 L200 190" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M322 200 L322 190 L312 190" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M190 312 L190 322 L200 322" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M322 312 L322 322 L312 322" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
